name: build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  windows:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Godot
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.2-stable
          include-templates: true

      - name: Desktop texture formats (phone imports are etc2)
        run: find . -name "*.import" -not -path "./.godot/*" -exec sed -i 's/etc2_astc/s3tc_bptc/g; s/\.etc2\./.s3tc./g' {} +

      - name: Import project
        run: godot --headless --import || true

      - name: Export Windows
        run: |
          mkdir -p build
          godot --headless --export-release "Windows Desktop" build/A-Beyhans-story.exe

      - uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: build/
